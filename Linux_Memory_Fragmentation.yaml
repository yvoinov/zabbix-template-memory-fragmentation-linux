zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 846977d1dfed4968bc5f8bdb363285bc
      name: 'Templates/Operating systems'
  templates:
    - uuid: 8bc8d565ae18493aa8073bb320af8d5b
      template: 'Linux Memory Fragmentation'
      name: 'Linux Memory Fragmentation'
      description: 'Obtaining an estimate of system memory fragmentation for Linux'
      groups:
        - name: 'Templates/Operating systems'
      items:
        - uuid: 3fdeeb6d43d948bc9fbb062ecef67acb
          name: 'Memory fragmentation'
          key: os.mem_frag
          value_type: FLOAT
          units: '%'
          description: 'Estimate of system memory fragmentation (approximate value)'
          triggers:
            - uuid: 581ced8f1518440ea67cd12f09899ff8
              expression: 'last(/Linux Memory Fragmentation/os.mem_frag)>{$MEM_FRAG}'
              name: 'High memory fragmentation'
              priority: WARNING
              description: 'Fragmentation level is above {$MEM_FRAG}. The default value is 80%.'
      macros:
        - macro: '{$MEM_FRAG}'
          value: '80'
          description: 'Memory fragmentation peak level'
